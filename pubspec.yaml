name: stay_bd
description: Bangladesh-centric Airbnb-style Flutter app — Riverpod + go_router edition.
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.6.1
  # Navigation
  go_router: ^14.6.1
  # Auth + database
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.3
  google_sign_in: ^6.2.2
  cloud_firestore: ^5.6.9
  firebase_messaging: ^15.2.5
  firebase_storage: ^12.4.4
  # UI helpers
  google_fonts: ^6.3.0
  cached_network_image: ^3.4.1
  smooth_page_indicator: ^1.2.0+3
  # Local persistence
  shared_preferences: ^2.3.2
  # Utilities
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.0
  latlong2: 0.9.1
  image_picker: ^1.1.2
  table_calendar: ^3.1.2
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  firebase_core_platform_interface: ^6.0.3
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/fixtures/
    - assets/images/
    - assets/images/branding/
    - assets/images/sea_pearl/
    - assets/images/sayeman/
    - assets/images/ocean_paradise/
    - assets/images/long_beach/
    - assets/images/cox_today/
    - assets/images/best_western/
    - assets/images/xpressmall/

flutter_launcher_icons:
  android: true
  image_path: "assets/images/branding/logo.png"
